name: ShiftWatch

on:
  push:
    paths:
      - "shiftwatch/**"
      - "tests/**"
      - "datasets/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/shiftwatch.yml"
  pull_request:
    paths:
      - "shiftwatch/**"
      - "tests/**"
      - "datasets/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/shiftwatch.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        default: evaluate
        type: choice
        options:
          - evaluate
          - llm-evaluate
          - code-evaluate
          - sql-evaluate
          - sql-monitor
          - monitor
      target_error_rate:
        description: "Expected error rate for monitoring"
        required: true
        default: "0.05"
        type: choice
        options:
          - "0.05"
          - "0.10"
          - "0.20"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run core tests
        run: python -m unittest discover -v

  service-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiftwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SHIFTWATCH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shiftwatch_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install service extras
        run: pip install -e '.[service,test]'
      - name: Run service integration tests
        run: python -m unittest tests.test_service -v

  run:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run selected task
        env:
          TASK: ${{ inputs.task }}
          TARGET_ERROR_RATE: ${{ inputs.target_error_rate }}
        run: |
          if [ "$TASK" = "evaluate" ]; then
            python -m shiftwatch.cli evaluate datasets/demo.jsonl \
              --output results/evaluation.csv | tee run-output.json
          elif [ "$TASK" = "llm-evaluate" ]; then
            python -m shiftwatch.cli llm-evaluate datasets/llm_demo.jsonl \
              --backend fixture \
              --output results/llm_evaluation.csv | tee run-output.json
          elif [ "$TASK" = "code-evaluate" ]; then
            python -m shiftwatch.cli code-evaluate datasets/code_tasks_demo.jsonl \
              --backend fixture \
              --repeats 3 \
              --output results/code_evaluation.csv | tee run-output.json
          elif [ "$TASK" = "sql-evaluate" ]; then
            python -m shiftwatch.cli sql-evaluate datasets/sql_misconceptions_30.jsonl \
              --backend fixture \
              --snapshot-id github-fixture \
              --output results/sql_evaluation.csv \
              --concept-output results/sql_concept_metrics.csv | tee run-output.json
          elif [ "$TASK" = "sql-monitor" ]; then
            python -m shiftwatch.cli sql-monitor datasets/demo_sql_concept_history.csv \
              --concept null_semantics \
              --target 0.10 \
              --output results/sql_concept_alarms.csv | tee run-output.json
          else
            python -m shiftwatch.cli monitor datasets/demo_batch_metrics.csv \
              --target "$TARGET_ERROR_RATE" \
              --output results/alarms.csv | tee run-output.json
          fi
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: shiftwatch-${{ inputs.task }}-${{ github.run_number }}
          path: |
            results/**
            run-output.json
          if-no-files-found: error
          retention-days: 14
